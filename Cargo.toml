[workspace]
resolver = "2"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/lingcoder/crab-code.git"
homepage = "https://github.com/lingcoder/crab-code"
keywords = ["cli", "ai", "coding-assistant", "llm", "agent"]
categories = ["command-line-utilities", "development-tools"]
description = "Rust-native agentic coding CLI — open-source alternative to Claude Code"

[workspace.dependencies]
# ─── Async Runtime ───
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
futures = "0.3"

# ─── Serialization ───
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
toml = "1.1.2"

# ─── CLI ───
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
owo-colors = "4"

# ─── HTTP ───
reqwest = { version = "0.13", features = ["json", "stream", "form", "multipart"] }
mime_guess = "2"
eventsource-stream = "0.2"
httpdate = "1"
either = "1"

# ─── TUI ───
ratatui = { version = "0.30", features = ["serde", "scrolling-regions", "unstable-backend-writer"] }
crossterm = { version = "0.29", features = ["event-stream"] }
tui-textarea = "0.7"
tachyonfx = "0.25"
tui-markdown = "0.3"
arboard = { version = "3", default-features = false }
tui-logger = "0.18"
color-eyre = "0.6"
supports-hyperlinks = "3"

# ─── Error Handling ───
thiserror = "2"
anyhow = "1"

# ─── Logging / Tracing ───
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

# ─── File System ───
globset = "0.4"
similar = "3"
regex = "1"
notify = "8"
ignore = "0.4"
fd-lock = "4.0"
dunce = "1"
grep-matcher = "0.1"
grep-regex = "0.1"
grep-searcher = "0.1"

# ─── Code Rendering ───
syntect = { version = "5", default-features = false, features = ["default-syntaxes", "default-themes", "regex-fancy"] }
pulldown-cmark = "0.13"

# ─── System ───
sysinfo = "0.39"
directories = "6"
libc = "0.2"

# ─── Auth ───
keyring = "4"
oauth2 = "5"

# ─── WebSocket / MCP ───
tokio-tungstenite = "0.29"
rmcp = { version = "1", default-features = false, features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest"] }

# ─── WASM Plugin ───
wasmtime = "46"

# ─── Process ───
portable-pty = "0.9"

# ─── Encoding & Crypto ───
base64 = "0.22"
sha2 = "0.11"
hmac = "0.13"
rand = "0.10"

# ─── PDF ───
pdf_oxide = "0.3"

# ─── Image ───
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }

# ─── Versioning ───
semver = "1"

# ─── Misc ───
uuid = { version = "1", features = ["v4"] }
ulid = "1"
lru = "0.18"
unicode-width = "0.2"
strip-ansi-escapes = "0.2"
textwrap = "0.16"
url = "2"
jsonschema = "0.46"
toml_edit = "0.25"
schemars = "1"
nucleo-matcher = "0.3"

# ─── Remote / Sandbox / Jobs ───
# rust_crypto: pure-rust HMAC/RSA backend; avoids cmake + aws_lc_rs build deps
# across Windows / Linux CI.
jsonwebtoken = { version = "10", default-features = false, features = ["rust_crypto", "use_pem"] }
# AWS event-stream (vnd.amazon.eventstream) framing for Bedrock streaming.
aws-smithy-eventstream = "0.60"
aws-smithy-types = "1"
bytes = "1"
# Agent Client Protocol (Zed) — editor ↔ agent standard, official Rust SDK
agent-client-protocol = "1"
async-trait = "0.1"
webbrowser = "1"
urlencoding = "2"
infer = "0.19"
shellexpand = "3"
axum = { version = "0.8", features = ["ws"] }
croner = "3"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
# Linux-only process sandbox
landlock = "0.4"
# Windows Job Object sandbox (target-gated in crab-sandbox)
windows-sys = { version = "^0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_System_SystemInformation",
] }
xcap = "0.9"
enigo = "0.6"

# ─── Testing ───
tempfile = "3"
wat = "1"
vt100 = "0.16"

# ─── Internal Crates ───
crab-utils = { path = "crates/utils" }
crab-core = { path = "crates/core" }
crab-config = { path = "crates/config" }
crab-auth = { path = "crates/auth" }
crab-api = { path = "crates/api" }
crab-mcp = { path = "crates/mcp" }
crab-acp = { path = "crates/acp" }
crab-ide = { path = "crates/ide" }
crab-fs = { path = "crates/fs" }
crab-process = { path = "crates/process" }
crab-tools = { path = "crates/tools" }
crab-session = { path = "crates/session" }
crab-agents = { path = "crates/agents" }
crab-tui = { path = "crates/tui" }
crab-plugin = { path = "crates/plugin" }
crab-skills = { path = "crates/skills" }
crab-memory = { path = "crates/memory" }
crab-telemetry = { path = "crates/telemetry" }
crab-hooks = { path = "crates/hooks" }
crab-engine = { path = "crates/engine" }
crab-remote = { path = "crates/remote" }
crab-sandbox = { path = "crates/sandbox" }
crab-cron = { path = "crates/cron" }
crab-swarm = { path = "crates/swarm" }
crab-commands = { path = "crates/commands" }

[workspace.lints.rust]
unsafe_code = "forbid"
# Keep in sync with CI (RUSTFLAGS=-Dwarnings)
unused_mut = "deny"
unused_comparisons = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
# Allow during M0 skeleton phase — will tighten as real impls land
must_use_candidate = "allow"
missing_panics_doc = "allow"
missing_const_for_fn = "allow"
missing_errors_doc = "allow"
unused_async = "allow"
new_without_default = "allow"
# Phase 2 generated code — refactor targets
struct_excessive_bools = "allow"
too_many_arguments = "allow"
too_many_lines = "allow"
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
fn_params_excessive_bools = "allow"
# Phase 2 stubs — will tighten as real impls land
unnecessary_wraps = "allow"
option_if_let_else = "allow"
or_fun_call = "allow"
comparison_chain = "allow"
if_same_then_else = "allow"
# Stylistic-only; `Duration::from_secs(3600)` reads just as well as
# `from_hours(1)`. The lint (rust 1.95+) fires across retry/timeout
# code with no functional benefit.
duration_suboptimal_units = "allow"

[profile.dev]
opt-level = 0
debug = true

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
opt-level = 3
